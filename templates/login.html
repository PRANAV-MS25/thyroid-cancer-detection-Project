<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ThyroidDetect - Login</title>
    <style>
        body, html { height: 100%; margin: 0; font-family: Arial, sans-serif; }
        .split-screen { display: flex; height: 100vh; }
        .left-bg { flex: 1; background: #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .left-bg img { width: 100%; height: 100%; object-fit: cover; }
        .right-form { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 60px; background: white; }
        h2 { color: #0f2537; margin-bottom: 5px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
        label { font-size: 13px; font-weight: bold; color: #334155; }
        input { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .btn-login { width: 100%; background: #1d4ed8; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .register-link { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
        .register-link a { color: #1d4ed8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="split-screen">
        <div class="left-bg">
    <img src="{{ url_for('static', filename='image.png') }}" alt="Thyroid Anatomy">
</div>
        <div class="right-form">
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to continue</p>
            
            {% if error %}
                <p style="color: red; font-size: 13px;">{{ error }}</p>
            {% endif %}

           <form action="/login" method="POST">
                <label>Email or Phone Number</label>
                <input type="text" name="identifier" placeholder="Enter Email or Phone" required>
                
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter Password" required>
                
                <button type="submit" class="btn-login">Login</button>
            </form>
            
            <div class="register-link">
                New user? <a href="/register">Click here to register</a>
            </div>
        </div>
    </div>
</body>
</html>
